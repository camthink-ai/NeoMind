[package]
name = "neomind-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "neomind"
path = "src/main.rs"

[features]
default = ["jemalloc"]
# jemalloc off = cross-compile escape hatch (tikv-jemalloc-sys's configure
# doesn't play well with zig cc). Native Linux builds keep it on by default.
jemalloc = ["dep:tikv-jemallocator"]
static = ["neomind-api/static"]

[dependencies]
# Only for the SDK VERSION constant (extension-create scaffolds it into
# fresh projects' Cargo.toml).
neomind-extension-sdk = { path = "../neomind-extension-sdk" }
neomind-core = { path = "../neomind-core" }
neomind-agent = { path = "../neomind-agent" }
neomind-api = { path = "../neomind-api" }
neomind-cli-ops = { path = "../neomind-cli-ops" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
# default-features = false drops zstd/bzip2/lzma/aes (deflate-only usage,
# matching neomind-core/neomind-api; the zstd family carried 4 open
# advisories — RUSTSEC-2026-0391/0398/0403/0410 — as dead code).
zip = { version = "2.1", default-features = false, features = ["deflate"] }

# CLI
clap = { workspace = true }

# Jemalloc global allocator (Linux only) — glibc malloc arena fragmentation
# causes RSS to climb 4-6 GB over days. macOS/Windows don't use glibc so
# they're unaffected. tikv-jemalloc-sys doesn't compile on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = { workspace = true }
tokio-test = "0.4"
