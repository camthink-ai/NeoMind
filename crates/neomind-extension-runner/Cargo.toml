[package]
name = "neomind-extension-runner"
version.workspace = true
edition = "2021"
description = "Standalone extension process runner for process-isolated extensions"
authors = ["NeoMind Team"]
license = "MIT"

[[bin]]
name = "neomind-extension-runner"
path = "src/main.rs"

[dependencies]
# Only depends on SDK for ABI stability - no dependency on neomind-core
neomind-extension-sdk = { path = "../neomind-extension-sdk" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
libloading = "0.8"
base64 = "0.22"
# WASM runtime (direct dependency)
# `component-model` feature dropped: code uses core `Module`/WASI preview1 only,
# never `wasmtime::component::*` (verified — reduces the 26→target port surface).
wasmtime = { version = "36", features = ["async"] }
wasmtime-wasi = { version = "36" }
thiserror = { workspace = true }
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
tempfile = { workspace = true }
