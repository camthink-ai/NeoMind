[package]
name = "neomind-api"
version.workspace = true
edition.workspace = true

[dev-dependencies]
# Enable testing feature when running tests
neomind-api = { path = ".", features = ["testing"] }
# Cross-crate auth-format check: neomind-cli-ops' offline reset must read/write
# the same users.redb bincode format (it duplicates our User struct).
neomind-cli-ops = { path = "../neomind-cli-ops" }
tower = { version = "0.5", features = ["util"] }

[features]
default = ["embedded-broker", "webhook", "email", "telegram", "wecom", "dingtalk", "slack", "feishu"]
embedded-broker = []
webhook = []
email = []
telegram = []
wecom = []
dingtalk = []
slack = []
feishu = []
static = ["rust-embed", "mime_guess"]
testing = []  # Enable test-only APIs for parallel test execution

[dependencies]
socket2 = "0.5"
neomind-core = { path = "../neomind-core" }
neomind-extension-sdk = { path = "../neomind-extension-sdk" }
neomind-agent = { path = "../neomind-agent", features = ["cloud", "llamacpp"] }
neomind-devices = { path = "../neomind-devices", features = ["embedded-broker"] }
neomind-rules = { path = "../neomind-rules" }
neomind-messages = { path = "../neomind-messages", features = ["webhook", "email", "telegram", "wecom", "dingtalk", "slack", "feishu"] }
neomind-storage = { path = "../neomind-storage" }
neomind-data-push = { path = "../neomind-data-push" }

# JavaScript execution (merged from neomind-automation)
# NOTE: 0.17→0.19 deferred to 0.9.11 — it's the Realm refactor (FunctionObjectBuilder
# takes &Realm, Context lifetime removed) and this is the user-facing transform engine;
# needs integration testing with real transforms, not a mid-0.9.10 change. The advisory
# (RUSTSEC-2024-0444, AsyncGenerator) is also likely unexploitable on our simple sync JS.
boa_engine = "0.21"

# Encoding (merged from neomind-automation)
hex = { workspace = true }
urlencoding = "2.1"

tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
# rustls 0.23 (pulled via reqwest's rustls-tls-...-no-provider build) does not
# auto-select a CryptoProvider — enable ring here so we can install it at startup
# (server/mod.rs start_server). ring is portable (alpine/musl + cross-compile).
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Web framework
axum = { workspace = true, features = ["ws", "multipart", "macros"] }
tower-http = { workspace = true }

# Utils
uuid = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
async-trait = { workspace = true }
get_if_addrs = "0.5"
base64 = { workspace = true }
async-stream = { workspace = true }
atty = "0.2"
sysinfo = "0.32"
tempfile = { workspace = true }

# Concurrent data structures
dashmap = { workspace = true }
parking_lot = { workspace = true }

# TLS certificate generation
rcgen = { workspace = true }
hostname = { workspace = true }
time = { workspace = true }

# Encryption
aes-gcm = { workspace = true }
sha2 = { workspace = true }
pbkdf2 = { workspace = true }
hmac = { workspace = true }
bcrypt = { workspace = true }

# Persistence
redb = { workspace = true }
bincode = { workspace = true }

# Version comparison
semver = { workspace = true }

# Cron expression validation
cron = "0.12"

# ZIP archive support
zip = "2"
tar = "0.4"
flate2 = "1"

# Image processing (decode headers for dimensions)
image = { workspace = true }

# Static file embedding (optional, requires 'static' feature)
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
