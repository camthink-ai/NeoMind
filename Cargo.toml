[workspace]
members = [
    "crates/neomind-core",
    "crates/neomind-api",
    "crates/neomind-cli",
    "crates/neomind-cli-ops",
    "crates/neomind-devices",
    "crates/neomind-storage",
    "crates/neomind-rules",
    "crates/neomind-messages",
    "crates/neomind-agent",
    "crates/neomind-extension-sdk",
    "crates/neomind-extension-runner",
    "crates/neomind-data-push",
    # Testing utilities (not part of main release)
    "crates/neomind-core/tests/fixtures/smoke-extension",
]
exclude = ["web"]
resolver = "2"

[workspace.package]
version = "0.9.22"
edition = "2021"
rust-version = "1.85"
authors = ["NeoMind Contributors"]
license = "Apache-2.0"
repository = "https://github.com/camthink-ai/NeoMind"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
# IMPORTANT: preserve_order feature is required for ABI compatibility between
# extension-runner and extension binaries. This ensures serde_json::Value uses
# IndexMap instead of HashMap, which has a stable memory layout across versions.
serde_json = { version = "1", features = ["preserve_order"] }
bincode = "1.3"
base64 = "0.22"
hex = "0.4"
urlencoding = "2.1"

# UI (Web)
axum = "0.7"
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "compression-br", "limit", "timeout"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Utils
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
rand = "0.8"
# Use rustls instead of OpenSSL for better cross-compilation support.
# NOTE: aws-lc-sys (~12MB C build) is pulled in via hyper-rustls 0.27's *default*
# features (which enable rustls/aws_lc_rs). reqwest 0.12 does NOT set
# hyper-rustls default-features=false, so we cannot drop aws-lc-rs from this manifest
# regardless of which rustls-tls-* feature we pick — it is an upstream constraint.
# Fix path: wait for reqwest to adopt hyper-rustls 0.28 (default dropped aws-lc-rs),
# or patch hyper-rustls. At runtime the process installs ring (start_server), so
# aws-lc-rs is compiled-but-mostly-unused today.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "stream"] }
# Feishu WS long-connection client. Default features (connect + handshake) stay
# on; add rustls-tls-webpki-roots so `wss://` works without system cert probes
# (bundles Mozilla roots statically — friendlier for aarch64 cross-compile, and
# consistent with the project's rustls-not-openssl direction).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "hostname", "builder", "tokio1-rustls", "ring", "rustls-native-certs"] }

# Image processing (decode headers for dimensions + image_edit tool formats)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }

# Storage
redb = "2.1"

# TLS certificate generation
rcgen = { version = "0.13", features = ["crypto"] }
hostname = "0.4"
time = "0.3"

# Crypto
aes-gcm = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
bcrypt = "0.15"

# Concurrent data structures
dashmap = "6"

# Caching
moka = { version = "0.12", features = ["sync"] }

# Timezone support
chrono-tz = "0.10"

# Utilities
regex = "1"
lru = "0.12"
toml = "0.8"
async-stream = "0.3"
tempfile = "3"
parking_lot = "0.12"

# Cross-platform directories (CLI auto-auth data dir lookup)
dirs = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
