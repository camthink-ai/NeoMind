name: Build NeoMind (Optimized for Speed)

# 手动触发构建
# 在 GitHub Actions 页面点击 "Run workflow" 按钮
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '构建原因（例如: test release, bug fix, etc.）'
        required: false
        default: 'Manual build'
      build_type:
        description: '构建类型'
        required: true
        type: choice
        options:
          - test
          - release
          - debug
        default: test

# 正式发布时自动触发（创建 tag 或 release 时）
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

env:
  # CI 环境变量优化
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  # 使用优化的 profile
  CARGO_PROFILE: ci-release
  # 禁用 sccache（CI 环境中不可用）
  SCACHE_CACHE_SIZE: 0
  RUSTC_WRAPPER: ""

jobs:
  # ========== 前端构建（只构建一次）==========
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    outputs:
      frontend-sha: ${{ steps.build.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      # 更激进的前端缓存策略
      - name: Cache frontend build
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            web/dist
            ~/.npm
          key: frontend-${{ hashFiles('web/package-lock.json', 'web/**/src/**', 'web/vite.config.ts', 'web/index.html', 'web/tsconfig.json', 'web/tailwind.config.js') }}
          restore-keys: |
            frontend-${{ hashFiles('web/package-lock.json') }}-
            frontend-

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build frontend
        id: build
        working-directory: ./web
        run: |
          npm run build
          echo "sha=$(shasum web/dist/index.html | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "✅ Frontend built successfully"
          ls -lh dist/

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 1

      - name: Create frontend release package
        if: contains(github.ref, 'refs/tags/')
        run: |
          # Extract version from tag (e.g., v0.6.2 -> 0.6.2)
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd web/dist
          tar czvf ../../neomind-web-${VERSION}.tar.gz .
          cd ../..
          echo "✅ Frontend package created: neomind-web-${VERSION}.tar.gz"
          ls -lh neomind-web-${VERSION}.tar.gz

      - name: Upload frontend release artifact
        if: contains(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: neomind-web
          path: neomind-web-*.tar.gz
          retention-days: 30

  # ========== 桌面应用构建（使用并行策略）==========
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-aarch64'
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: 'windows-x86_64'
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: 'linux-x86_64'
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: 'linux-aarch64'
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

      - name: Verify frontend build
        run: test -f web/dist/index.html && echo "✅ Frontend ready"

      # 更激进的 Rust 缓存策略
      # Key includes matrix.os (the exact runner image, e.g. ubuntu-22.04 vs
      # ubuntu-latest/24.04) so caches don't cross-contaminate across GLIBC
      # versions — build-script binaries compiled on 24.04 require GLIBC_2.39
      # and crash on 22.04 ("version GLIBC_2.39 not found"). restore-keys is
      # likewise scoped to the image to prevent pulling stale 24.04 artifacts.
      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            web/src-tauri/target/
          key: cargo-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ matrix.target }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install additional macOS target
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          # Install create-dmg for DMG bundling
          brew install create-dmg || true

      - name: Install frontend dependencies (for Tauri CLI)
        working-directory: ./web
        run: npm ci

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            liblzma-dev

      # ========== 优化：使用更快的构建选项 ==========
      - name: Build external binary (extension runner)
        shell: bash
        run: |
          # 使用环境变量启用并行编译
          export CARGO_BUILD_JOBS=4
          export CARGO_PROFILE_RELEASE_LTO=thin
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256

          # Build extension runner (CLI is dispatched in-process, no sidecar needed)
          cargo build --release -p neomind-extension-runner --target ${{ matrix.target }}

          # Prepare binary for Tauri
          mkdir -p web/src-tauri/binaries

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/neomind-extension-runner.exe \
               web/src-tauri/binaries/neomind-extension-runner-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/neomind-extension-runner \
               web/src-tauri/binaries/neomind-extension-runner-${{ matrix.target }}
            chmod +x web/src-tauri/binaries/neomind-extension-runner-${{ matrix.target }}
          fi

          echo "✅ External binary built for ${{ matrix.target }}"
          ls -lh web/src-tauri/binaries/

      - name: Clean old bundle artifacts
        shell: bash
        run: |
          # Remove stale bundle files from previous builds (CI caches target/ directory)
          BUNDLE_DIR="web/src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            echo "🧹 Cleaning old bundle artifacts from cache..."
            rm -rf "$BUNDLE_DIR"
          fi

      - name: Build Tauri app
        working-directory: ./web
        shell: bash
        run: |
          # Try building with all bundles first, fall back to subset if external download fails
          npm run tauri build -- --target ${{ matrix.target }} || {
            echo "⚠️ Full build failed, retrying with reduced bundle types..."
            if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
              # macOS: retry without DMG
              npm run tauri build -- --target ${{ matrix.target }} --bundles app
            elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              # Windows: retry with NSIS only
              npm run tauri build -- --target ${{ matrix.target }} --bundles nsis
            else
              # Linux: retry with deb+rpm only (skip AppImage — AppRun download can be flaky)
              npm run tauri build -- --target ${{ matrix.target }} --bundles deb,rpm
            fi
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Collect updater artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p updater-out
          BUNDLE_DIR="web/src-tauri/target/${{ matrix.target }}/release/bundle"

          # Tauri v2 puts updater artifacts in platform-specific dirs, NOT bundle/updater/
          # macOS: bundle/macos/NeoMind.app.tar.gz + .sig
          # Windows: bundle/nsis/*.exe.sig
          # Linux: bundle/appimage/*.AppImage.sig

          # Collect all .sig files
          find "$BUNDLE_DIR" -name "*.sig" -exec cp {} updater-out/ \; 2>/dev/null || true

          # macOS: collect .app.tar.gz (the updater bundle)
          find "$BUNDLE_DIR" -name "*.app.tar.gz" ! -name "*.sig" -exec cp {} updater-out/ \; 2>/dev/null || true

          echo "✅ Collected updater artifacts:"
          ls -la updater-out/ 2>/dev/null || echo "  (none found)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neomind-desktop-${{ matrix.platform }}
          path: |
            web/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            web/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            web/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            web/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            web/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            web/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          retention-days: 30
          if-no-files-found: warn

      - name: Upload updater artifacts separately
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: neomind-updater-${{ matrix.platform }}
          path: updater-out/*
          retention-days: 90
          if-no-files-found: ignore

  # ========== 服务器构建（纯 API，无前端嵌入）==========
  # 服务器与前端分离部署：
  # - 服务器只提供 API 接口
  # - 前端独立部署（nginx/CDN）
  # - 通过反向代理或 CORS 实现通信
  build-server:
    name: Server (${{ matrix.os }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target: x86_64-unknown-linux-gnu
            arch: amd64
            runner: ubuntu-22.04  # pin to oldest supported LTS for glibc 2.35 baseline (ubuntu-latest=24.04 breaks 22.04 hosts)
          - os: linux
            target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-22.04-arm  # pin to oldest supported LTS for glibc 2.35 baseline (matches amd64)
          - os: darwin
            target: aarch64-apple-darwin
            arch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install additional macOS targets
        if: matrix.os == 'darwin'
        run: rustup target add aarch64-apple-darwin

      # 更激进的 Rust 缓存策略
      # Key includes matrix.runner so ubuntu-22.04 and ubuntu-latest caches stay
      # separate — aws_lc_sys / ring build C code whose symbols depend on the
      # host glibc/toolchain, and reusing a cache built on a newer image breaks
      # linking (e.g. undefined __isoc23_sscanf when 24.04 artifacts land on 22.04).
      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: server-v2-${{ matrix.runner }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            server-v2-${{ matrix.runner }}-${{ matrix.target }}-

      # ========== 构建纯 API 服务器（无前端嵌入）==========
      # Both linux arches now run on native runners (amd64 on ubuntu-22.04 x86_64,
      # arm64 on ubuntu-22.04-arm ARM64), so both use plain `cargo build`. The old
      # `cross` cross-compile path was removed — its cached x86_64 binary failed
      # with "Exec format error" on the ARM runner, and native builds are faster.
      - name: Build server and extension runner (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -e
          cargo build --release -p neomind-cli --target ${{ matrix.target }}
          cargo build --release -p neomind-extension-runner --target ${{ matrix.target }}

          # Verify binaries exist
          ls -la target/${{ matrix.target }}/release/neomind target/${{ matrix.target }}/release/neomind-extension-runner
        env:
          CC: clang
          CXX: clang++

      - name: Run native capability IPC smoke test
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        shell: bash
        run: |
          cargo test -p neomind-core --test capability_e2e_test test_native_isolated_capability_ipc -- --ignored
          cargo test -p neomind-core --test capability_e2e_test test_native_isolated_event_capability_ipc -- --ignored

      - name: Build server and extension runner (macOS)
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          set -e

          # Build server binary (no static feature - pure API server)
          cargo build --release -p neomind-cli --target ${{ matrix.target }}

          # Build extension runner
          cargo build --release -p neomind-extension-runner --target ${{ matrix.target }}

          # Verify binaries exist
          ls -la target/${{ matrix.target }}/release/neomind target/${{ matrix.target }}/release/neomind-extension-runner

      - name: Create release archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../neomind-server-${{ matrix.os }}-${{ matrix.arch }}.tar.gz neomind neomind-extension-runner

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: neomind-server-${{ matrix.os }}-${{ matrix.arch }}
          path: neomind-server-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 30

  # ========== Release job ==========
  release:
    needs: [build-frontend, build-desktop, build-server]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'refs/tags/')
    permissions:
      contents: write   # create the release + upload assets
      actions: write    # dispatch the release-notify workflow (see step below)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # CHANGELOG.md is the single source of truth for release notes.
          #   short -> OTA updater `notes` field + Discord embed (glanceable)
          #   full  -> GitHub Release body (long-form)
          # Falls back to a plain version label so a missing/empty section
          # never breaks the release pipeline.
          python3 scripts/extract_changelog.py --version "${VERSION}" --mode short > changelog_short.md || true
          python3 scripts/extract_changelog.py --version "${VERSION}" --mode full  > changelog_full.md  || true
          [ -s changelog_short.md ] || echo "NeoMind ${VERSION}" > changelog_short.md
          [ -s changelog_full.md ]  || echo "## NeoMind ${VERSION}" > changelog_full.md
          echo "===== OTA/Discord short version ====="; cat changelog_short.md; echo
          echo "===== release body full version: $(wc -c < changelog_full.md) chars ====="

      - name: Generate latest-update.json
        id: update_manifest
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="${GITHUB_REF_NAME}"
          BASE_URL="https://github.com/camthink-ai/NeoMind/releases/download/${TAG}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "📦 Generating update manifest for version ${VERSION}"

          # Platform mappings: artifact dir -> (platform_key, sig_pattern, url_file_pattern)
          # For each platform, we need to find the .sig and the corresponding release asset URL

          PLATFORMS_JSON=""
          FOUND=0

          add_platform() {
            local platform_key="$1"
            local sig_file="$2"
            local url_file="$3"

            if [ ! -f "$sig_file" ] || [ ! -f "$url_file" ]; then
              echo "⚠️ Missing artifacts for $platform_key"
              return
            fi

            local signature=$(cat "$sig_file" | tr -d '\n\r')
            local url_name=$(basename "$url_file")
            local url="${BASE_URL}/${url_name}"

            if [ "$FOUND" -gt 0 ]; then
              PLATFORMS_JSON+=","
            fi

            PLATFORMS_JSON+=$'\n'"    \"${platform_key}\": {\"signature\": \"${signature}\", \"url\": \"${url}\"}"
            FOUND=$((FOUND + 1))
            echo "✅ $platform_key -> $url_name"
          }

          # macOS aarch64: sig is .app.tar.gz.sig, URL file is .app.tar.gz
          add_platform "darwin-aarch64" \
            "$(find artifacts/neomind-updater-macos-aarch64 -name "*.app.tar.gz.sig" 2>/dev/null | head -1)" \
            "$(find artifacts/neomind-updater-macos-aarch64 -name "*.app.tar.gz" ! -name "*.sig" 2>/dev/null | head -1)"

          # Windows x86_64: sig is nsis *.exe.sig, URL file is the nsis .exe from desktop artifacts
          add_platform "windows-x86_64" \
            "$(find artifacts/neomind-updater-windows-x86_64 -name "*x64-setup.exe.sig" 2>/dev/null | grep "${VERSION}" | head -1)" \
            "$(find artifacts/neomind-desktop-windows-x86_64 -name "*x64-setup.exe" 2>/dev/null | grep "${VERSION}" | head -1)"

          # Linux x86_64: sig is AppImage.sig, URL file is the AppImage from desktop artifacts
          add_platform "linux-x86_64" \
            "$(find artifacts/neomind-updater-linux-x86_64 -name "*amd64.AppImage.sig" 2>/dev/null | grep "${VERSION}" | head -1)" \
            "$(find artifacts/neomind-desktop-linux-x86_64 -name "*amd64.AppImage" 2>/dev/null | grep "${VERSION}" | head -1)"

          # Linux aarch64: sig is AppImage.sig, URL file is the AppImage from desktop artifacts
          add_platform "linux-aarch64" \
            "$(find artifacts/neomind-updater-linux-aarch64 -name "*aarch64.AppImage.sig" 2>/dev/null | grep "${VERSION}" | head -1)" \
            "$(find artifacts/neomind-desktop-linux-aarch64 -name "*aarch64.AppImage" 2>/dev/null | grep "${VERSION}" | head -1)"

          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ No updater artifacts found - skipping latest-update.json"
            echo "has_manifest=false" >> $GITHUB_OUTPUT
          else
            cat > latest-update.json << EOFJ
          {
            "version": "${VERSION}",
            "notes": "NeoMind ${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {${PLATFORMS_JSON}
            }
          }
          EOFJ

            # Validate, pretty-print, and inject the curated short changelog
            # into the OTA `notes` field (replaces the version-only placeholder).
            # jq safely JSON-escapes the multi-line notes text.
            NOTES="$(cat changelog_short.md)"
            jq --arg notes "${NOTES}" '.notes = $notes' latest-update.json > latest-update-tmp.json \
              && mv latest-update-tmp.json latest-update.json

            echo "✅ Generated latest-update.json with ${FOUND} platforms:"
            cat latest-update.json
            echo "has_manifest=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Lead with the curated CHANGELOG section (single source of truth),
          # then the downloads/install template. GitHub's auto-generated commit
          # log (generate_release_notes: true below) appends after the body.
          cp changelog_full.md release_notes.md
          cat >> release_notes.md << 'EOF'

          ---

          ## Downloads

          ### Desktop Application (Recommended for Personal Use)
          - **macOS**: Download `.dmg` file
          - **Windows**: Download `.msi` installer or `.exe` portable
          - **Linux**: Download `.AppImage` (universal) or `.deb` (Debian/Ubuntu)

          ### Server Deployment
          1. **Backend Server**: Download `neomind-server-{os}-{arch}.tar.gz`
             - Extract and run: `./neomind serve`
             - Default port: 9375

          2. **Frontend Static Files**: Download `neomind-web-{version}.tar.gz`

          **All-in-One** (default, no nginx needed):
          - Extract frontend to `/var/www/neomind` (or configure `NEOMIND_WEB_DIR`)
          - The server serves both API and Web UI on the same port

          **Frontend-Backend Separation** (optional, with nginx):
          - Add `USE_NGINX=true` during installation
          - Frontend served by nginx on port 80, API on port 9375

          ### One-line Installation (Linux & macOS)

          ```bash
          # All-in-one (default)
          curl -fsSL https://raw.githubusercontent.com/camthink-ai/NeoMind/main/scripts/install.sh | sh

          # Backend only (users connect via local desktop app)
          curl -fsSL https://raw.githubusercontent.com/camthink-ai/NeoMind/main/scripts/install.sh | NO_WEB=true sh

          # With nginx for frontend-backend separation
          curl -fsSL https://raw.githubusercontent.com/camthink-ai/NeoMind/main/scripts/install.sh | USE_NGINX=true sh
          ```

          ---

          EOF

          echo "release_notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            latest-update.json
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/neomind-updater-**/*.app.tar.gz
            artifacts/neomind-server-linux-amd64/**/*.tar.gz
            artifacts/neomind-server-linux-arm64/**/*.tar.gz
            artifacts/neomind-server-darwin-arm64/**/*.tar.gz
            artifacts/neomind-web/**/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce release on Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # The default GITHUB_TOKEN that published this release does NOT emit a
          # `release: published` event that triggers other workflows (GitHub
          # blocks token-generated events to prevent loops). So dispatch the
          # release-notify workflow explicitly — workflow_dispatch is one of the
          # two events exempted from that rule. release-notify.yml then
          # self-fetches the release notes via `gh release view`.
          echo "Dispatching release-notify for ${GITHUB_REF_NAME}…"
          if gh workflow run release-notify.yml --repo "${REPO}" -f tag_name="${GITHUB_REF_NAME}"; then
            echo "✅ dispatched release-notify"
          else
            echo "⚠️ failed to dispatch release-notify (non-fatal — release itself succeeded)"
          fi

  # ========== Auto-cleanup old releases (keep latest 3) ==========
  cleanup-releases:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete drafts + old releases (keep latest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          KEEP=3
          echo "🧹 Cleaning up releases..."

          # 1. Delete ALL draft releases first.
          # Drafts are incomplete releases that were never published. They linger on
          # the /releases page (sorted to the top for collaborators) and obscure the
          # real "latest" release. The previous filter (select(.isDraft == false))
          # never touched them, so stale drafts from abandoned release attempts
          # (e.g. the old v0.8.x drafts) piled up indefinitely. Tags are kept.
          gh release list --repo "$REPO" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft == true)] | .[].tagName' \
            | while read -r tag; do
                echo "  deleting draft release: $tag"
                gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag=false 2>/dev/null \
                  && echo "    ✅ deleted draft" || echo "    ⚠️ skip"
              done

          # 2. Keep the latest $KEEP published releases, delete the rest.
          gh release list --repo "$REPO" --limit 100 --json tagName,isDraft,createdAt \
            --jq "[.[] | select(.isDraft == false)] | sort_by(.createdAt) | reverse | .[$KEEP:][] | .tagName" \
            | while read -r tag; do
                echo "  deleting old release: $tag"
                gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag=false 2>/dev/null \
                  && echo "    ✅ deleted" || echo "    ⚠️ skip"
              done

          REMAINING=$(gh release list --repo "$REPO" --limit 100 --json tagName --jq 'length')
          echo "✅ Cleanup done. Remaining releases: $REMAINING"
