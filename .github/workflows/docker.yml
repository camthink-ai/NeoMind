name: Build & Publish Docker Image

# Multi-arch (amd64 + arm64) image built with NATIVE runners (no QEMU) and
# published to Docker Hub (docker.io/<DOCKERHUB_USERNAME>/neomind).
#
# Each architecture builds on its OWN native GitHub runner (amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm) and pushes a per-arch tag, then a
# merge job combines them into the multi-arch :<version> + :latest manifest.
#
# Why not QEMU: the previous single-job QEMU-emulated arm64 build took 4h+ to
# compile the ~780-dep Rust workspace under emulation and timed out on the
# v0.9.10 tag. Native arm64 runners (free for public repos) build each arch in
# minutes. https://github.blog/...arm64-runners
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — Docker Hub account name, e.g. camthink
#   DOCKERHUB_TOKEN    — Docker Hub access token (PAT) with Read/Write scope

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (e.g. 0.9.11). Defaults to "dev".'
        required: false
        default: dev

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/neomind

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Derive version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # refs/tags/v0.9.11 -> 0.9.11
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build ONE arch natively, LOAD locally (no push yet), smoke-test the
      # runtime, and only then push the per-arch tag. The merge job below
      # combines the per-arch tags into the multi-arch :<version> + :latest.
      # The smoke gate exists because "it compiled" is not "it runs": the
      # libgomp1 gap (faa3fc9b) shipped a llama-server that exec'd into a
      # zombie on every arch while the build stayed green.
      - name: Build (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: neomind:smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Runtime smoke — builtin LLM must come up
        run: |
          docker run -d --name smoke -p 127.0.0.1:9375:9375 neomind:smoke-${{ matrix.arch }}
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT

          # 1. API server healthy
          ok=0
          for i in $(seq 1 30); do
            curl -sf http://localhost:9375/api/health && { ok=1; break; } || sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::API never became healthy"; docker logs smoke 2>&1 | tail -50; exit 1; }

          # 2. Builtin llama-server spawned, loaded the model, passed its
          #    health probe (this is the line that never fires when the
          #    bundled binary can't exec — e.g. missing shared libs).
          ok=0
          for i in $(seq 1 60); do
            docker logs smoke 2>&1 | grep -q "Builtin LLM ready" && { ok=1; break; } || sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::builtin LLM never became ready"; docker logs smoke 2>&1 | tail -80; exit 1; }
          echo "smoke OK: API healthy + builtin LLM ready (${{ matrix.arch }})"

      - name: Push per-arch tag
        run: |
          V="${{ steps.ver.outputs.version }}"
          docker tag neomind:smoke-${{ matrix.arch }} ${{ env.IMAGE }}:${V}-${{ matrix.arch }}
          docker push ${{ env.IMAGE }}:${V}-${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Derive version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Combine the per-arch images into a single multi-arch manifest, tagged
      # both :<version> and :latest. `docker pull` then auto-selects the arch.
      - name: Merge per-arch images into multi-arch manifest
        run: |
          V="${{ steps.ver.outputs.version }}"
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${V} \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${V}-amd64 \
            ${{ env.IMAGE }}:${V}-arm64

      - name: Verify merged manifest
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
